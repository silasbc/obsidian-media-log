# Media Log release gate: the same build, smoke, documentation, history-wide
# privacy, and release-asset checks that guard manual releases.
name: release-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the privacy gate scans every reachable historical blob
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: npm run release:check
      - run: npm run privacy:self-test
